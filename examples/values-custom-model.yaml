tenant:
  id: acme

auth:
  existingSecret: hermes-webui-auth

persistentStorage:
  hermesHome:
    size: 20Gi
    storageClass: standard
  workspace:
    size: 100Gi
    storageClass: standard

# Ingress existant: le chart crée seulement le Service ClusterIP.
ingress:
  enabled: false

# Déclare un endpoint OpenAI-compatible dès le premier démarrage sans utiliser
# un provider Hermes "custom". Cette version d'Hermes/WebUI peut ne pas exposer
# Custom dans la liste des providers; on garde donc provider=openai-api et c'est
# base_url qui force l'appel vers Ollama/LM Studio/vLLM/etc.
hermesConfig:
  openAICompatibleEndpoint:
    enabled: true
    provider: openai-api
    model: qwen2.5-coder:32b
    baseUrl: http://ollama.ollama.svc.cluster.local:11434/v1
    apiKey: local
    contextLength: 64000
  seed:
    enabled: true
    overwrite: false
    # Si le PVC contient déjà une ancienne .env avec OPENAI_API_KEY, activez
    # temporairement envOverwrite=true avec envConfig ci-dessous pour repartir
    # sur le seul endpoint configuré dans config.yaml.
    envOverwrite: false
    envConfig: |
      # Endpoint local keyless/Ollama: aucune clé OpenAI/Anthropic ici.
