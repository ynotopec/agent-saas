apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hermes-webui.fullname" . }}
  labels:
    {{- include "hermes-webui.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  progressDeadlineSeconds: 1800
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "hermes-webui.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hermes-webui.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "hermes-webui.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        {{- if and .Values.hermesConfig.seed.enabled .Values.persistentStorage.hermesHome.enabled }}
        - name: seed-hermes-config
          image: "{{ .Values.hermesConfig.seed.initImage.repository }}:{{ .Values.hermesConfig.seed.initImage.tag }}"
          imagePullPolicy: {{ .Values.hermesConfig.seed.initImage.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              target={{ .Values.env.HERMES_CONFIG_PATH | default (printf "%s/config.yaml" .Values.persistentStorage.hermesHome.mountPath) | quote }}
              target_dir="$(dirname "$target")"
              mkdir -p "$target_dir"
              if [ -f /hermes-config/{{ .Values.hermesConfig.seed.secretKey }} ] && { [ {{ ternary "1" "0" .Values.hermesConfig.seed.overwrite | quote }} = "1" ] || [ ! -s "$target" ]; }; then
                cp /hermes-config/{{ .Values.hermesConfig.seed.secretKey }} "$target"
                chmod 600 "$target"
              fi
              env_target="$target_dir/.env"
              if [ -f /hermes-config/{{ .Values.hermesConfig.seed.envSecretKey }} ] && { [ {{ ternary "1" "0" .Values.hermesConfig.seed.envOverwrite | quote }} = "1" ] || [ ! -s "$env_target" ]; }; then
                cp /hermes-config/{{ .Values.hermesConfig.seed.envSecretKey }} "$env_target"
                chmod 600 "$env_target"
              fi
          volumeMounts:
            - name: hermes-home
              mountPath: {{ .Values.persistentStorage.hermesHome.mountPath }}
            - name: hermes-config-seed
              mountPath: /hermes-config
              readOnly: true
        {{- end }}
        - name: init-agent-src
          image: {{ printf "%s@%s" .Values.agentImage.repository .Values.agentImage.digest | quote }}
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - {{ .Files.Get "runtime/copy-source.sh" | toJson }}
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: hermes-agent-src
              mountPath: /agent-src
      containers:
        - name: hermes-webui
          image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: HERMES_WEBUI_AGENT_DIR
              value: /home/hermeswebui/.hermes/hermes-agent
            - name: WANTED_UID
              value: "1000"
            - name: WANTED_GID
              value: "1000"
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if or .Values.auth.existingSecret .Values.auth.password }}
            - name: HERMES_WEBUI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "hermes-webui.secretName" . }}
                  key: {{ .Values.auth.passwordKey }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: hermes-agent-src
              mountPath: /home/hermeswebui/.hermes/hermes-agent
              readOnly: true
            {{- if .Values.persistentStorage.hermesHome.enabled }}
            - name: hermes-home
              mountPath: {{ .Values.persistentStorage.hermesHome.mountPath }}
            {{- end }}
            {{- if .Values.persistentStorage.workspace.enabled }}
            - name: workspace
              mountPath: {{ .Values.persistentStorage.workspace.mountPath }}
            {{- end }}
          startupProbe:
            exec:
              command:
                - /app/venv/bin/python
                - -c
                - {{ .Files.Get "runtime/probe.py" | toJson }}
            periodSeconds: 10
            timeoutSeconds: 20
            failureThreshold: 120
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            exec:
              command:
                - /app/venv/bin/python
                - -c
                - {{ .Files.Get "runtime/probe.py" | toJson }}
            periodSeconds: 30
            timeoutSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: hermes-agent-src
          emptyDir: {}
        {{- if and .Values.hermesConfig.seed.enabled .Values.persistentStorage.hermesHome.enabled }}
        - name: hermes-config-seed
          secret:
            secretName: {{ include "hermes-webui.configSecretName" . }}
        {{- end }}
        {{- if .Values.persistentStorage.hermesHome.enabled }}
        - name: hermes-home
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-home" (include "hermes-webui.fullname" .)) .Values.persistentStorage.hermesHome.existingClaim }}
        {{- end }}
        {{- if .Values.persistentStorage.workspace.enabled }}
        - name: workspace
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-workspace" (include "hermes-webui.fullname" .)) .Values.persistentStorage.workspace.existingClaim }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
