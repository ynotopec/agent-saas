{{- $endpointConfig := and .Values.hermesConfig.openAICompatibleEndpoint.enabled (not .Values.hermesConfig.seed.config) -}}
{{- if and .Values.hermesConfig.seed.enabled (not .Values.hermesConfig.seed.existingSecret) (or .Values.hermesConfig.seed.config .Values.hermesConfig.seed.envConfig $endpointConfig) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hermes-webui.configSecretName" . }}
  labels:
    {{- include "hermes-webui.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.hermesConfig.seed.config }}
  {{ .Values.hermesConfig.seed.secretKey }}: |-
{{ .Values.hermesConfig.seed.config | nindent 4 }}
  {{- else if $endpointConfig }}
  {{ .Values.hermesConfig.seed.secretKey }}: |-
    model:
      default: {{ .Values.hermesConfig.openAICompatibleEndpoint.model | quote }}
      provider: {{ .Values.hermesConfig.openAICompatibleEndpoint.provider | quote }}
      base_url: {{ .Values.hermesConfig.openAICompatibleEndpoint.baseUrl | quote }}
      {{ with .Values.hermesConfig.openAICompatibleEndpoint.keyEnv }}
      api_key: {{ printf "${%s}" . | quote }}
      {{ else }}
      {{ with .Values.hermesConfig.openAICompatibleEndpoint.apiKey }}
      api_key: {{ . | quote }}
      {{ end }}
      {{ end }}
      {{ with .Values.hermesConfig.openAICompatibleEndpoint.contextLength }}
      context_length: {{ . }}
      {{ end }}
      {{ with .Values.hermesConfig.openAICompatibleEndpoint.apiMode }}
      api_mode: {{ . | quote }}
      {{ end }}
  {{- end }}
  {{- with .Values.hermesConfig.seed.envConfig }}
  {{ $.Values.hermesConfig.seed.envSecretKey }}: |-
{{ . | nindent 4 }}
  {{- end }}
{{- end }}
