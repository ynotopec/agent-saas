replicaCount: 1

image:
  repository: ghcr.io/nesquena/hermes-webui
  # Version incluant les correctifs de découverte des providers/modèles custom.
  tag: 0.51.185
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1024
  fsGroupChangePolicy: OnRootMismatch

# Le conteneur officiel démarre en root pour préparer les volumes puis baisse ses privilèges.
# Durcir ici seulement après validation avec votre StorageClass et votre politique PodSecurity.
securityContext: {}

service:
  type: ClusterIP
  port: 8787

# Activez cette section si vous souhaitez que le chart crée l'objet Ingress.
# Laissez ingress.enabled=false si votre objet Ingress existe déjà et route déjà vers le Service du chart.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: hermes.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Mot de passe HTTP de Hermes WebUI. Recommandé dès que l'application est exposée.
auth:
  existingSecret: ""
  passwordKey: HERMES_WEBUI_PASSWORD
  password: ""

# Variables d'environnement non sensibles.
env:
  HERMES_WEBUI_HOST: 0.0.0.0
  HERMES_WEBUI_PORT: "8787"
  HERMES_HOME: /home/hermeswebui/.hermes
  HERMES_CONFIG_PATH: /home/hermeswebui/.hermes/config.yaml
  HERMES_WEBUI_STATE_DIR: /home/hermeswebui/.hermes/webui
  HERMES_WEBUI_DEFAULT_WORKSPACE: /workspace
  # Déploiement managé: le chart peut précharger config.yaml, donc on évite que
  # le wizard de première connexion réécrive un provider/API key différent.
  HERMES_WEBUI_SKIP_ONBOARDING: "1"


# Configuration Hermes initiale. Utile pour déclarer un endpoint OpenAI-compatible
# dès le déploiement et éviter de dépendre uniquement du wizard de première connexion.
# Le contenu est copié dans le PVC Hermes Home avant le démarrage de l'application.
hermesConfig:
  # Raccourci Helm pour créer un endpoint OpenAI-compatible sans utiliser de provider
  # Hermes nommé "custom". Quand enabled=true et seed.config est vide, le chart
  # génère uniquement le bloc model avec un provider connu et base_url; Hermes
  # route alors directement vers base_url.
  openAICompatibleEndpoint:
    enabled: false
    # Garder un provider connu par Hermes. base_url prend le dessus pour l'appel réel.
    provider: openai-api
    model: qwen2.5-coder:32b
    baseUrl: http://ollama.ollama.svc.cluster.local:11434/v1
    # Pour Ollama/local, une valeur factice évite les clients OpenAI qui exigent
    # un token même si le serveur n'authentifie pas. Laissez vide si vous utilisez keyEnv.
    apiKey: local
    # Nom d'une variable d'environnement contenant la clé réelle (ex: TOGETHER_API_KEY).
    # Si renseigné, api_key: ${VAR} est écrit dans config.yaml au lieu d'apiKey.
    keyEnv: ""
    contextLength: 64000
    apiMode: chat_completions
  seed:
    enabled: false
    # Si overwrite=false, le fichier n'est copié que si HERMES_CONFIG_PATH n'existe pas déjà.
    # Passez temporairement à true pour corriger un config.yaml existant sur un PVC.
    overwrite: false
    existingSecret: ""
    secretKey: config.yaml
    config: ""
    # Optionnel: précharger aussi /home/hermeswebui/.hermes/.env. Utile pour
    # supprimer les clés provider obsolètes (ex: OPENAI_API_KEY) déjà présentes
    # dans le PVC en activant temporairement envOverwrite=true.
    envSecretKey: .env
    envConfig: ""
    envOverwrite: false
    initImage:
      repository: busybox
      tag: "1.36"
      pullPolicy: IfNotPresent

# Variables d'environnement sensibles ou provider keys à injecter depuis des Secrets existants.
extraEnvFrom: []
# - secretRef:
#     name: hermes-provider-secrets

persistentStorage:
  hermesHome:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    mountPath: /home/hermeswebui/.hermes
  workspace:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 20Gi
    mountPath: /workspace

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}

# Réglage SaaS simple: déployer une release Helm par tenant dans son namespace.
tenant:
  id: default
