# Export this object with: python3 scripts/hermes-release.py helm-values
# Fixed official images at least releaseDelayDays old; updates require canary validation.
release:
  schema_version: 1
  selection_date: '2026-10-09'
  cutoff: '2026-10-02T14:05:16Z'
  agent:
    tag: v2026.9.24
    image: nousresearch/hermes-agent@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7
    published_at: '2026-09-24T10:18:09Z'
    source_revision: f97608f178d1ffeca59860195ab7da295f7c8e5f
    architectures:
    - amd64
    - arm64
  webui:
    tag: 0.52.404
    image: ghcr.io/nesquena/hermes-webui@sha256:005718b9dc5249f385ab30ccf968b00830791ea59379d26210cde085075f94a5
    published_at: '2026-10-02T12:54:24Z'
    source_revision: 62e4d7b9e2560f9d49c0c29c2dc1414fbd4e2d12
    python: 3.12.15
    architectures:
    - amd64
    - arm64
releaseDelayDays: 7
agentImage:
  repository: nousresearch/hermes-agent
  digest: sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7

replicaCount: 1

image:
  repository: ghcr.io/nesquena/hermes-webui
  digest: sha256:005718b9dc5249f385ab30ccf968b00830791ea59379d26210cde085075f94a5
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch

# Le conteneur officiel démarre en root pour préparer les volumes puis baisse ses privilèges.
# Durcir ici seulement après validation avec votre StorageClass et votre politique PodSecurity.
securityContext: {}

service:
  type: ClusterIP
  port: 8787

# Activez cette section si vous souhaitez que le chart crée l'objet Ingress.
# Laissez ingress.enabled=false si votre objet Ingress existe déjà et route déjà vers le Service du chart.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: hermes.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Mot de passe HTTP de Hermes WebUI. Recommandé dès que l'application est exposée.
auth:
  existingSecret: ""
  passwordKey: HERMES_WEBUI_PASSWORD
  password: ""

# Variables d'environnement non sensibles.
env:
  HERMES_WEBUI_HOST: 0.0.0.0
  HERMES_WEBUI_PORT: "8787"
  HERMES_HOME: /home/hermeswebui/.hermes
  HERMES_CONFIG_PATH: /home/hermeswebui/.hermes/config.yaml
  HERMES_WEBUI_STATE_DIR: /home/hermeswebui/.hermes/webui
  HERMES_WEBUI_DEFAULT_WORKSPACE: /workspace
  # Déploiement managé: le chart peut précharger config.yaml, donc on évite que
  # le wizard de première connexion réécrive un provider/API key différent.
  HERMES_WEBUI_SKIP_ONBOARDING: "1"


# Configuration Hermes initiale. Le contenu est copié dans le PVC Hermes Home
# avant le démarrage de l'application.
hermesConfig:
  seed:
    enabled: false
    # Si overwrite=false, le fichier n'est copié que si HERMES_CONFIG_PATH n'existe pas déjà.
    # Passez temporairement à true pour corriger un config.yaml existant sur un PVC.
    overwrite: false
    existingSecret: ""
    secretKey: config.yaml
    config: ""
    # Optionnel: précharger aussi /home/hermeswebui/.hermes/.env. Utile pour
    # supprimer les clés provider obsolètes (ex: OPENAI_API_KEY) déjà présentes
    # dans le PVC en activant temporairement envOverwrite=true.
    envSecretKey: .env
    envConfig: ""
    envOverwrite: false
    initImage:
      repository: busybox
      tag: "1.36"
      pullPolicy: IfNotPresent

# Variables d'environnement sensibles ou provider keys à injecter depuis des Secrets existants.
extraEnvFrom: []
# - secretRef:
#     name: hermes-provider-secrets

persistentStorage:
  hermesHome:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    mountPath: /home/hermeswebui/.hermes
  workspace:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 20Gi
    mountPath: /workspace

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

nodeSelector: {}
tolerations: []
affinity: {}

# Réglage SaaS simple: déployer une release Helm par tenant dans son namespace.
tenant:
  id: default
