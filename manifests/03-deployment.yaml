apiVersion: apps/v1
kind: Deployment
metadata:
  name: agents-saas
  namespace: demo1
  labels:
    app: agents-saas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agents-saas
  template:
    metadata:
      labels:
        app: agents-saas
    spec:
      serviceAccountName: agents-saas-sa
      containers:
      - name: agents-saas
        image: python:3.12-slim
        command: ["python3", "/app/app.py"]
        ports:
        - containerPort: 8000
        env:
        - name: LLM_BASE_URL
          value: "https://api-nothink.ailab.infocepo.com/v1"
        - name: LLM_API_KEY
          valueFrom:
            secretKeyRef:
              name: agents-saas-secrets
              key: LLM_API_KEY
        - name: LLM_PROVIDER
          value: "infocepo-alias"
        - name: LLM_MODEL
          value: "ai-thinking"
        - name: LLM_CONTEXT_LENGTH
          value: "262144"
        - name: API_SERVER_KEY
          valueFrom:
            secretKeyRef:
              name: agents-saas-secrets
              key: API_SERVER_KEY
        - name: DEPLOY_TOKEN
          valueFrom:
            secretKeyRef:
              name: agents-saas-secrets
              key: DEPLOY_TOKEN
        - name: HERMES_WEBUI_PASSWORD
          valueFrom:
            secretKeyRef:
              name: agents-saas-secrets
              key: HERMES_WEBUI_PASSWORD
        resources:
          limits:
            cpu: "500m"
            memory: "1Gi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 3
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 30
        volumeMounts:
        - name: app-files
          mountPath: /app
        - name: pip-packages
          mountPath: /usr/local/lib/python3.12/site-packages
      initContainers:
      - name: install-pip-packages
        image: python:3.12-slim
        command: ["pip3", "install", "fastapi", "uvicorn", "pydantic", "argon2-cffi", "trafilatura", "httpx", "--target", "/packages"]
        volumeMounts:
        - name: pip-packages
          mountPath: /packages
      volumes:
      - name: app-files
        configMap:
          name: agents-saas-app
      - name: pip-packages
        emptyDir: {}
