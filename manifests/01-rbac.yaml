apiVersion: v1
kind: ServiceAccount
metadata:
  name: agents-saas-sa
  namespace: demo1
  labels:
    app: agents-saas
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agents-saas-role
  namespace: demo1
  labels:
    app: agents-saas
rules:
- apiGroups: [""]
  resources: ["pods", "persistentvolumeclaims", "services", "configmaps", "secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["networking.k8s.io"]
  resources: ["ingresses"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["cert-manager.io"]
  resources: ["certificates"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agents-saas-binding
  namespace: demo1
  labels:
    app: agents-saas
subjects:
- kind: ServiceAccount
  name: agents-saas-sa
  namespace: demo1
roleRef:
  kind: Role
  name: agents-saas-role
  apiGroup: rbac.authorization.k8s.io
