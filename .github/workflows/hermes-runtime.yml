name: Hermes runtime regression checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest fastapi httpx pyyaml argon2-cffi trafilatura
      - name: Install Helm
        run: |
          curl -fsSLO https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz
          curl -fsSLO https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz.sha256sum
          sha256sum --check helm-v3.19.0-linux-amd64.tar.gz.sha256sum
          tar -xzf helm-v3.19.0-linux-amd64.tar.gz
          sudo install linux-amd64/helm /usr/local/bin/helm
      - run: python -m pytest -q
      - run: bash -n deploy-agent.sh scripts/test-hermes-images.sh
  official-images:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import AIAgent and check health with untouched official images
        run: bash scripts/test-hermes-images.sh
